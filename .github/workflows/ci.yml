name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Neither an API key nor the network is needed: the Nebius client is replaced by a
      # fake, and the tests that need the 240MB ONNX model report themselves as skipped.
      - run: uv sync --group dev
      - run: uv run ruff check apu tests scripts cloud_registry
      - run: uv run pytest -q
